# ============================================================
# PortableLauncher 配置  (KEY=VALUE，等号两侧不要留空格)
# 一份配置对应一个软件；换软件只改下面这几行。
# ============================================================

Name=MyApp
Exe=App\MyApp.exe

# 启动参数，可留空
Args=

# 1 = 等程序关闭后窗口才关；0 = 启动后立即关窗口
Wait=0

# 安装模式: none | nsis | inno | msi-admin | msi-install | 7z
#   none        程序已经解包在 App\ 里，直接启动
#   nsis        NSIS 安装包静默装到 App\      (/S /D=)
#   inno        Inno Setup 安装包静默装到 App\ (/VERYSILENT /DIR=)
#   msi-admin   MSI 只解包不注册（推荐，无需管理员）(msiexec /a)
#   msi-install MSI 真安装到 App\（会写 HKLM，需管理员）
#   7z          用 7z.exe 直接解包（绝大多数安装包都能开）
InstallMode=nsis

Installer=Installer\setup.exe

# 7z 模式时 7z.exe 的路径
SevenZip=

# 安装前备份、安装后还原的注册表键（逗号分隔），用来抹掉安装痕迹；留空 = 不碰注册表
# 例: RegBackupKeys=HKCU\Software\VendorName\AppName,HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\AppName
RegBackupKeys=

# 额外环境变量，分号分隔。例: CUDA_VISIBLE_DEVICES=1;HF_HOME=D:\hf
Env=

# 0 = 不重定向用户目录（只做安装/启动）
Redirect=1
